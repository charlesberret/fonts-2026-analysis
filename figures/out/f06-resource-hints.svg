  <g id="text_18">
   <text style="font-weight: 500; font-size: 8.37px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="40.32" y="29.97" transform="rotate(-0 40.32 29.97)">Figure 6</text>
  </g>
  <g id="text_19">
   <text style="font-size: 8.7048px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #5b5d66" x="76.815" y="30.3048" transform="rotate(-0 76.815 30.3048)">Resource Hints</text>
  </g>
  <g id="text_20">
   <text style="font-weight: 600; font-size: 21.6px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="40.32" y="59.04" transform="rotate(-0 40.32 59.04)">Font Resource Hints, 2022–2026</text>
  </g>
  <g id="text_21">
   <text style="font-size: 9.0396px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #5b5d66" x="40.32" y="79.294437" transform="rotate(-0 40.32 79.294437)">What share of desktop pages ask the browser to prepare early for fonts? Hints from authors and from tools look alike.</text>
  </g>
  <g id="text_22">
   <text style="font-style: italic; font-size: 8.0352px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #5b5d66" x="40.32" y="111.325334" transform="rotate(-0 40.32 111.325334)">percent of desktop pages</text>
  </g>
  <g id="text_23">
   <text style="font-size: 8.7048px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="501.12" y="116.7048" transform="rotate(-0 501.12 116.7048)">preconnect</text>
  </g>
  <g id="text_24">
   <text style="font-size: 8.7048px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="501.12" y="132.5448" transform="rotate(-0 501.12 132.5448)">preload</text>
  </g>
  <g id="text_25">
   <text style="font-size: 8.7048px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="501.12" y="148.3848" transform="rotate(-0 501.12 148.3848)">dns-prefetch</text>
  </g>
  <g id="text_26">
   <text style="font-weight: 700; font-size: 64.8px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="486.72" y="233.28" transform="rotate(-0 486.72 233.28)">20.3</text>
  </g>
  <g id="text_27">
   <text style="font-weight: 700; font-size: 25.92px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="614.083821" y="209.211429" transform="rotate(-0 614.083821 209.211429)">%</text>
  </g>
  <g id="text_28">
   <text style="font-size: 10.044px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="486.72" y="263.187514" transform="rotate(-0 486.72 263.187514)">Preconnect has nearly doubled</text>
  </g>
  <g id="text_29">
   <text style="font-size: 10.044px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="486.72" y="276.244714" transform="rotate(-0 486.72 276.244714)">since 2022 and leads every other</text>
  </g>
  <g id="text_30">
   <text style="font-size: 10.044px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="486.72" y="289.301914" transform="rotate(-0 486.72 289.301914)">font hint.</text>
  </g>
  <g id="text_31">
   <text style="font-style: italic; font-size: 8.37px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #5b5d66" x="486.72" y="310.016746" transform="rotate(-0 486.72 310.016746)">Preload passed dns-prefetch this year,</text>
  </g>
  <g id="text_32">
   <text style="font-style: italic; font-size: 8.37px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #5b5d66" x="486.72" y="321.316246" transform="rotate(-0 486.72 321.316246)">14.7% to 13.6%. dns-prefetch was 17.8%</text>
  </g>
  <g id="text_33">
   <text style="font-style: italic; font-size: 8.37px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #5b5d66" x="486.72" y="332.615746" transform="rotate(-0 486.72 332.615746)">in 2022.</text>
  </g>
  <g id="text_34">
   <text style="font-size: 8.0352px; font-family: 'Hanken Grotesk'; fill: #5b5d66" transform="translate(40.32 361.336772)">Source: HTTP Archive desktop root pages, mid-year crawls (2026 = July 1, 2026 crawl). Hints count only when they point at a font host or font file; 2022 is</text>
   <text style="font-size: 8.0352px; font-family: 'Hanken Grotesk'; fill: #5b5d66" transform="translate(40.32 374.411549)">re-run with the definition used since 2024. prefetch (0.7% in 2026) is not shown. Percentages are of all desktop root pages.</text>
  </g>
 </g>
