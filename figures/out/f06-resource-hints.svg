  <g id="text_18">
   <text style="font-weight: 500; font-size: 8.37px; font-family: 'Schibsted Grotesk'; text-anchor: start; fill: #181a23" x="40.32" y="29.773828" transform="rotate(-0 40.32 29.773828)">Figure 6</text>
  </g>
  <g id="text_19">
   <text style="font-size: 8.7048px; font-family: 'Schibsted Grotesk'; text-anchor: start; fill: #5b5d66" x="80.37" y="30.100781" transform="rotate(-0 80.37 30.100781)">Resource Hints</text>
  </g>
  <g id="text_20">
   <text style="font-weight: 600; font-size: 21.6px; font-family: 'Schibsted Grotesk'; text-anchor: start; fill: #181a23" x="40.32" y="58.53375" transform="rotate(-0 40.32 58.53375)">Font Resource Hints, 2022–2026</text>
  </g>
  <g id="text_21">
   <text style="font-size: 9.0396px; font-family: 'Schibsted Grotesk'; text-anchor: start; fill: #5b5d66" x="40.32" y="79.139125" transform="rotate(-0 40.32 79.139125)">What share of desktop pages ask the browser to prepare early for fonts? Hints from authors and from tools look alike.</text>
  </g>
  <g id="text_22">
   <text style="font-style: italic; font-size: 8.0352px; font-family: 'Schibsted Grotesk'; text-anchor: start; fill: #5b5d66" x="40.32" y="111.688425" transform="rotate(-0 40.32 111.688425)">percent of desktop pages</text>
  </g>
  <g id="text_23">
   <text style="font-size: 8.7048px; font-family: 'Schibsted Grotesk'; text-anchor: start; fill: #181a23" x="501.12" y="116.500781" transform="rotate(-0 501.12 116.500781)">preconnect</text>
  </g>
  <g id="text_24">
   <text style="font-size: 8.7048px; font-family: 'Schibsted Grotesk'; text-anchor: start; fill: #181a23" x="501.12" y="132.340781" transform="rotate(-0 501.12 132.340781)">preload</text>
  </g>
  <g id="text_25">
   <text style="font-size: 8.7048px; font-family: 'Schibsted Grotesk'; text-anchor: start; fill: #181a23" x="501.12" y="148.180781" transform="rotate(-0 501.12 148.180781)">dns-prefetch</text>
  </g>
  <g id="text_26">
   <text style="font-weight: 700; font-size: 63.36px; font-family: 'Schibsted Grotesk'; text-anchor: start; fill: #181a23" x="486.72" y="230.355" transform="rotate(-0 486.72 230.355)">20.3</text>
  </g>
  <g id="text_27">
   <text style="font-weight: 700; font-size: 25.344px; font-family: 'Schibsted Grotesk'; text-anchor: start; fill: #181a23" x="624.564064" y="207.712286" transform="rotate(-0 624.564064 207.712286)">%</text>
  </g>
  <g id="text_28">
   <text style="font-size: 10.3788px; font-family: 'Schibsted Grotesk'; text-anchor: start; fill: #181a23" x="486.72" y="261.613003" transform="rotate(-0 486.72 261.613003)">Preconnect has nearly doubled</text>
  </g>
  <g id="text_29">
   <text style="font-size: 10.3788px; font-family: 'Schibsted Grotesk'; text-anchor: start; fill: #181a23" x="486.72" y="275.105443" transform="rotate(-0 486.72 275.105443)">since 2022 and leads every</text>
  </g>
  <g id="text_30">
   <text style="font-size: 10.3788px; font-family: 'Schibsted Grotesk'; text-anchor: start; fill: #181a23" x="486.72" y="288.597883" transform="rotate(-0 486.72 288.597883)">other font hint.</text>
  </g>
  <g id="text_31">
   <text style="font-style: italic; font-size: 8.37px; font-family: 'Schibsted Grotesk'; text-anchor: start; fill: #5b5d66" x="486.72" y="309.269167" transform="rotate(-0 486.72 309.269167)">Preload passed dns-prefetch this year,</text>
  </g>
  <g id="text_32">
   <text style="font-style: italic; font-size: 8.37px; font-family: 'Schibsted Grotesk'; text-anchor: start; fill: #5b5d66" x="486.72" y="320.568667" transform="rotate(-0 486.72 320.568667)">14.7% to 13.6%. dns-prefetch was 17.8%</text>
  </g>
  <g id="text_33">
   <text style="font-style: italic; font-size: 8.37px; font-family: 'Schibsted Grotesk'; text-anchor: start; fill: #5b5d66" x="486.72" y="331.868167" transform="rotate(-0 486.72 331.868167)">in 2022.</text>
  </g>
  <g id="text_34">
   <text style="font-size: 8.0352px; font-family: 'Schibsted Grotesk'; fill: #5b5d66" transform="translate(40.32 361.209967)">Source: HTTP Archive desktop root pages, mid-year crawls (2026 = July 1, 2026 crawl). Hints count only when they point at a font host or font file;</text>
   <text style="font-size: 8.0352px; font-family: 'Schibsted Grotesk'; fill: #5b5d66" transform="translate(40.32 373.608029)">2022 is re-run with the definition used since 2024. prefetch (0.7% in 2026) is not shown. Percentages are of all desktop root pages.</text>
  </g>
 </g>
