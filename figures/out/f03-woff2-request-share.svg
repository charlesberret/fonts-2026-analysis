  </g>
  <g id="text_19">
   <text style="font-weight: 500; font-size: 21.6px; font-family: 'Funnel Display'; text-anchor: start; fill: #181a23" x="40.32" y="59.04" transform="rotate(-0 40.32 59.04)">WOFF2 share of font requests, 2019–2026</text>
  </g>
  <g id="text_20">
   <text style="font-size: 9.3312px; font-family: 'Funnel Sans'; text-anchor: start; fill: #5b5d66" x="40.32" y="77.886" transform="rotate(-0 40.32 77.886)">What share of font requests are WOFF2. Dots mark the years we measured, and there are none for 2021 or 2023.</text>
  </g>
  <g id="text_21">
   <text style="font-style: italic; font-size: 8.2944px; font-family: 'Funnel Sans'; text-anchor: start; fill: #5b5d66" x="40.32" y="111.6864" transform="rotate(-0 40.32 111.6864)">percent of font requests</text>
  </g>
  <g id="text_22">
   <text style="font-weight: 300; font-size: 69.12px; font-family: 'Funnel Display'; text-anchor: start; fill: #181a23" x="486.72" y="175.68" transform="rotate(-0 486.72 175.68)">83.7</text>
  </g>
  <g id="text_23">
   <text style="font-weight: 300; font-size: 27.648px; font-family: 'Funnel Display'; text-anchor: start; fill: #181a23" x="622.985143" y="150.006857" transform="rotate(-0 622.985143 150.006857)">%</text>
  </g>
  <g id="text_24">
   <text style="font-size: 13.1328px; font-family: 'Funnel Sans'; fill: #181a23" transform="translate(486.72 211.685349)">WOFF2 now carries over</text>
   <text style="font-size: 13.1328px; font-family: 'Funnel Sans'; fill: #181a23" transform="translate(486.72 230.235429)">four in five desktop font</text>
   <text style="font-size: 13.1328px; font-family: 'Funnel Sans'; fill: #181a23" transform="translate(486.72 249.934629)">requests, up from 73.9%</text>
   <text style="font-size: 13.1328px; font-family: 'Funnel Sans'; fill: #181a23" transform="translate(486.72 270.782949)">in 2019.</text>
  </g>
  <g id="text_25">
   <text style="font-style: italic; font-size: 10.102154px; font-family: 'Funnel Sans'; fill: #5b5d66" transform="translate(486.72 298.614382)">Counted by distinct font URLs,</text>
   <text style="font-style: italic; font-size: 10.102154px; font-family: 'Funnel Sans'; fill: #5b5d66" transform="translate(486.72 313.717102)">WOFF2 is 68.5% (Fig. 4). High-traffic</text>
   <text style="font-style: italic; font-size: 10.102154px; font-family: 'Funnel Sans'; fill: #5b5d66" transform="translate(486.72 328.870333)">hosts push the request share higher.</text>
  </g>
  <g id="text_26">
   <text style="font-size: 7.9488px; font-family: 'Funnel Sans'; text-anchor: start; fill: #5b5d66" x="40.32" y="360.957456" transform="rotate(-0 40.32 360.957456)">Source: HTTP Archive font requests, mid-year crawls (July; Aug. 2020, June 2022; 2026 = July 1, 2026 crawl). Denominator: font requests per client.</text>
  </g>
