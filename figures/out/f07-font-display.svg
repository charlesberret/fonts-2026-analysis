  <g id="text_21">
   <text style="font-size: 8.9856px; font-family: 'Funnel Sans'; text-anchor: start; fill: #5b5d66" x="67.68" y="30.5856" transform="rotate(-0 67.68 30.5856)">font-display</text>
  </g>
  <g id="text_22">
   <text style="font-weight: 500; font-size: 21.6px; font-family: 'Funnel Display'; text-anchor: start; fill: #181a23" x="40.32" y="59.04" transform="rotate(-0 40.32 59.04)">font-display values, 2022, 2025 and 2026</text>
  </g>
  <g id="text_23">
   <text style="font-size: 9.3312px; font-family: 'Funnel Sans'; text-anchor: start; fill: #5b5d66" x="40.32" y="77.839344" transform="rotate(-0 40.32 77.839344)">What share of desktop root pages declare each value. Pages with no value are not shown, and a page may declare more than one.</text>
  </g>
  <g id="text_24">
   <text style="font-style: italic; font-size: 8.2944px; font-family: 'Funnel Sans'; text-anchor: start; fill: #5b5d66" x="40.32" y="111.6864" transform="rotate(-0 40.32 111.6864)">percent of desktop root pages</text>
  </g>
  <g id="text_25">
   <text style="font-size: 8.9856px; font-family: 'Funnel Sans'; text-anchor: start; fill: #181a23" x="501.12" y="116.9856" transform="rotate(-0 501.12 116.9856)">2022</text>
