  <g id="text_35">
   <text style="font-size: 7.8552px; font-family: 'Schibsted Grotesk'; fill: #5b5d66" transform="translate(40.32 361.021571)">Source: HTTP Archive desktop root pages, mid-year crawls (2026 = July 1, 2026 crawl); only these three years were measured the same way. 2026 values are</text>
   <text style="font-size: 7.8552px; font-family: 'Schibsted Grotesk'; fill: #5b5d66" transform="translate(40.32 373.1419)">corrected for stylesheets the extraction set aside for size. Pages that set no value are not shown. Percentages are of all desktop root pages.</text>
  </g>
