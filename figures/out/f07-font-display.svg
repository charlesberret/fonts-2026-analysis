   <text style="font-weight: 300; font-size: 25.344px; font-family: 'Funnel Display'; text-anchor: start; fill: #181a23" x="611.629714" y="206.866286" transform="rotate(-0 611.629714 206.866286)">%</text>
  </g>
  <g id="text_30">
   <text style="font-size: 10.7136px; font-family: 'Funnel Sans'; fill: #181a23" transform="translate(486.72 261.026743)">Swap is now on over half of</text>
   <text style="font-size: 10.7136px; font-family: 'Funnel Sans'; fill: #181a23" transform="translate(486.72 277.043575)">desktop pages, up 6.2 points</text>
   <text style="font-size: 10.7136px; font-family: 'Funnel Sans'; fill: #181a23" transform="translate(486.72 294.185335)">from 2025.</text>
  </g>
  <g id="text_31">
   <text style="font-style: italic; font-size: 8.64px; font-family: 'Funnel Sans'; fill: #5b5d66" transform="translate(486.72 317.165143)">block holds at 24.5%, largely an icon-font</text>
   <text style="font-style: italic; font-size: 8.64px; font-family: 'Funnel Sans'; fill: #5b5d66" transform="translate(486.72 330.168343)">default rather than a choice for body text.</text>
  </g>
  <g id="text_32">
   <text style="font-size: 7.9488px; font-family: 'Funnel Sans'; fill: #5b5d66" transform="translate(40.32 360.957456)">Source: HTTP Archive desktop root pages, mid-year crawls (2026 = July 1, 2026 crawl); only these three years were measured the same way. 2026 values are</text>
   <text style="font-size: 7.9488px; font-family: 'Funnel Sans'; fill: #5b5d66" transform="translate(40.32 373.377456)">corrected for stylesheets the extraction set aside for size. Denominator: desktop root pages.</text>
  </g>
