  <g id="text_29">
   <text style="font-size: 7.9488px; font-family: 'Funnel Sans'; fill: #5b5d66" transform="translate(40.32 360.957456)">Source: HTTP Archive desktop root pages, mid-year crawls (2026 = July 1, 2026 crawl). Hints count only when they point at a font host or font file; 2022 is re-run</text>
   <text style="font-size: 7.9488px; font-family: 'Funnel Sans'; fill: #5b5d66" transform="translate(40.32 373.377456)">with the definition used since 2024. prefetch (0.7% in 2026) is not shown. Denominator: desktop root pages.</text>
