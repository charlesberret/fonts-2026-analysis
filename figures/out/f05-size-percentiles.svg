  </g>
  <g id="text_23">
   <text style="font-size: 14.0616px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="486.72" y="189.943663" transform="rotate(-0 486.72 189.943663)">The heaviest 1% of</text>
  </g>
  <g id="text_24">
   <text style="font-size: 14.0616px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="486.72" y="208.223743" transform="rotate(-0 486.72 208.223743)">desktop font files start</text>
  </g>
  <g id="text_25">
   <text style="font-size: 14.0616px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="486.72" y="226.503823" transform="rotate(-0 486.72 226.503823)">there. The median</text>
  </g>
  <g id="text_26">
   <text style="font-size: 14.0616px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="486.72" y="244.783903" transform="rotate(-0 486.72 244.783903)">is 35.3 kB.</text>
  </g>
  <g id="text_27">
   <text style="font-style: italic; font-size: 10.816615px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #5b5d66" x="486.72" y="272.928352" transform="rotate(-0 486.72 272.928352)">Three-quarters of files stay</text>
  </g>
  <g id="text_28">
   <text style="font-style: italic; font-size: 10.816615px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #5b5d66" x="486.72" y="287.530783" transform="rotate(-0 486.72 287.530783)">under 77.2 kB. Adobe-served</text>
  </g>
  <g id="text_29">
   <text style="font-style: italic; font-size: 10.816615px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #5b5d66" x="486.72" y="302.133214" transform="rotate(-0 486.72 302.133214)">OpenType files alone make up</text>
