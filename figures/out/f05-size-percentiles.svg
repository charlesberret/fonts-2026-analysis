  </g>
  <g id="text_18">
   <text style="font-weight: 600; font-size: 21.6px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="40.32" y="59.04" transform="rotate(-0 40.32 59.04)">Font File Size by Percentile, 2026</text>
  </g>
  <g id="text_19">
   <text style="font-size: 9.0396px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #5b5d66" x="40.32" y="79.298674" transform="rotate(-0 40.32 79.298674)">How big are font files? Each dot is a percentile: p50 is the middle file, and p99 is bigger than 99 of every 100. Each distinct font file counts once.</text>
  </g>
  <g id="text_20">
   <text style="font-style: italic; font-size: 8.0352px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #5b5d66" x="40.32" y="111.325334" transform="rotate(-0 40.32 111.325334)">kilobytes (kB) per file, on a log scale, for distinct font files</text>
  </g>
  <g id="text_21">
   <text style="font-weight: 700; font-size: 53.28px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="486.72" y="159.84" transform="rotate(-0 486.72 159.84)">874.7</text>
  </g>
  <g id="text_22">
