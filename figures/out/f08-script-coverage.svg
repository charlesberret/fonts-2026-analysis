  </g>
  <g id="text_34">
   <text style="font-weight: 500; font-size: 21.6px; font-family: 'Funnel Display'; text-anchor: start; fill: #181a23" x="40.32" y="59.04" transform="rotate(-0 40.32 59.04)">Script coverage of font files, 2026</text>
  </g>
  <g id="text_35">
   <text style="font-size: 9.3312px; font-family: 'Funnel Sans'; text-anchor: start; fill: #5b5d66" x="40.32" y="77.839344" transform="rotate(-0 40.32 77.839344)">What share of distinct desktop font files cover more than 5% of each script's characters. Han needs 4,920 ideographs, so slices don't count.</text>
  </g>
  <g id="text_36">
   <text style="font-style: italic; font-size: 8.2944px; font-family: 'Funnel Sans'; text-anchor: start; fill: #5b5d66" x="40.32" y="111.6864" transform="rotate(-0 40.32 111.6864)">percent of distinct desktop font files</text>
  </g>
  <g id="text_37">
