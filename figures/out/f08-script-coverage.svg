  <g id="text_40">
   <text style="font-size: 10.7136px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="486.72" y="258.147566" transform="rotate(-0 486.72 258.147566)">small slice of the font. Han</text>
  </g>
  <g id="text_41">
   <text style="font-size: 10.7136px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="486.72" y="272.075246" transform="rotate(-0 486.72 272.075246)">registers in only 0.5% of files</text>
  </g>
  <g id="text_42">
   <text style="font-size: 10.7136px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="486.72" y="286.002926" transform="rotate(-0 486.72 286.002926)">because it arrives cut up.</text>
  </g>
  <g id="text_43">
   <text style="font-style: italic; font-size: 8.37px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #5b5d66" x="486.72" y="307.568647" transform="rotate(-0 486.72 307.568647)">Static slicing is the workaround</text>
  </g>
  <g id="text_44">
   <text style="font-style: italic; font-size: 8.37px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #5b5d66" x="486.72" y="318.868147" transform="rotate(-0 486.72 318.868147)">Incremental Font Transfer is meant</text>
  </g>
  <g id="text_45">
   <text style="font-style: italic; font-size: 8.37px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #5b5d66" x="486.72" y="330.167647" transform="rotate(-0 486.72 330.167647)">to replace.</text>
  </g>
  <g id="text_46">
   <text style="font-size: 7.8552px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #5b5d66" x="40.32" y="361.145536" transform="rotate(-0 40.32 361.145536)">Source: HTTP Archive font URLs, desktop, July 1, 2026 crawl. A script counts when a file covers more than 5% of its characters. Percentages are of all font files.</text>
