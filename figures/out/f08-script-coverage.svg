  </g>
  <g id="text_39">
   <text style="font-size: 12.4416px; font-family: 'Funnel Sans'; fill: #181a23" transform="translate(486.72 233.737838)">Han reaches the web as</text>
   <text style="font-size: 12.4416px; font-family: 'Funnel Sans'; fill: #181a23" transform="translate(486.72 251.218286)">slices: only 0.5% of font files</text>
   <text style="font-size: 12.4416px; font-family: 'Funnel Sans'; fill: #181a23" transform="translate(486.72 269.880686)">carry a near-complete set,</text>
   <text style="font-size: 12.4416px; font-family: 'Funnel Sans'; fill: #181a23" transform="translate(486.72 288.480878)">against 57% for Latin.</text>
