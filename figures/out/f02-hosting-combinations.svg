   <text style="font-size: 8.0352px; font-family: 'Schibsted Grotesk'; fill: #5b5d66" transform="translate(40.32 361.209967)">Source: HTTP Archive desktop root pages, mid-year crawls (2026 = July 1, 2026 crawl). Other combinations not shown. Percentages are of all</text>
