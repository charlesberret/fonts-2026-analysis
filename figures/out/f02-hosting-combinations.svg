  </g>
  <g id="text_20">
   <text style="font-weight: 600; font-size: 21.6px; font-family: 'Schibsted Grotesk'; text-anchor: start; fill: #181a23" x="40.32" y="58.53375" transform="rotate(-0 40.32 58.53375)">Font Hosting Combinations, 2022–2026</text>
  </g>
  <g id="text_21">
   <text style="font-size: 9.0396px; font-family: 'Schibsted Grotesk'; text-anchor: start; fill: #5b5d66" x="40.32" y="79.139125" transform="rotate(-0 40.32 79.139125)">How do desktop pages get their fonts: from Google, from their own servers, or both? Other combinations are not shown.</text>
  </g>
  <g id="text_22">
   <text style="font-style: italic; font-size: 8.0352px; font-family: 'Schibsted Grotesk'; text-anchor: start; fill: #5b5d66" x="40.32" y="111.688425" transform="rotate(-0 40.32 111.688425)">percent of desktop pages</text>
  </g>
  <g id="text_23">
