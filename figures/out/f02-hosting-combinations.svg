  </g>
  <g id="text_24">
   <text style="font-size: 8.7048px; font-family: 'Schibsted Grotesk'; text-anchor: start; fill: #181a23" x="501.12" y="132.340781" transform="rotate(-0 501.12 132.340781)">Self-hosted only</text>
  </g>
  <g id="text_25">
