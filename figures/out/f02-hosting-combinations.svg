  </g>
  <g id="text_28">
   <text style="font-size: 10.7136px; font-family: 'Funnel Sans'; fill: #181a23" transform="translate(486.72 264.305746)">Self-hosting alone covers nearly a</text>
   <text style="font-size: 10.7136px; font-family: 'Funnel Sans'; fill: #181a23" transform="translate(486.72 280.376146)">third of desktop pages.</text>
  </g>
  <g id="text_29">
   <text style="font-style: italic; font-size: 8.64px; font-family: 'Funnel Sans'; fill: #5b5d66" transform="translate(486.72 304.427314)">Much of it is Google's catalog under</text>
   <text style="font-style: italic; font-size: 8.64px; font-family: 'Funnel Sans'; fill: #5b5d66" transform="translate(486.72 318.251314)">another address: at least 35.7% of named</text>
   <text style="font-style: italic; font-size: 8.64px; font-family: 'Funnel Sans'; fill: #5b5d66" transform="translate(486.72 330.390514)">self-hosted requests.</text>
  </g>
  <g id="text_30">
   <text style="font-size: 7.9488px; font-family: 'Funnel Sans'; text-anchor: start; fill: #5b5d66" x="40.32" y="360.957456" transform="rotate(-0 40.32 360.957456)">Source: HTTP Archive desktop root pages, mid-year crawls (2026 = July 1, 2026 crawl). Other combinations not shown. Denominator: desktop root pages.</text>
