  <g id="text_19">
   <text style="font-size: 8.7048px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #5b5d66" x="76.815" y="30.3048" transform="rotate(-0 76.815 30.3048)">Font Hosting</text>
  </g>
  <g id="text_20">
   <text style="font-weight: 600; font-size: 21.6px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="40.32" y="59.04" transform="rotate(-0 40.32 59.04)">Font Hosting Combinations, 2022–2026</text>
  </g>
  <g id="text_21">
   <text style="font-size: 9.0396px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #5b5d66" x="40.32" y="79.312799" transform="rotate(-0 40.32 79.312799)">How do desktop pages get their fonts: from Google, from their own servers, or both? Other combinations are not shown.</text>
  </g>
  <g id="text_22">
   <text style="font-style: italic; font-size: 8.0352px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #5b5d66" x="40.32" y="111.325334" transform="rotate(-0 40.32 111.325334)">percent of desktop pages</text>
  </g>
  <g id="text_23">
   <text style="font-size: 8.7048px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="501.12" y="116.7048" transform="rotate(-0 501.12 116.7048)">Both Google and self-hosted</text>
  </g>
  <g id="text_24">
   <text style="font-size: 8.7048px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="501.12" y="132.5448" transform="rotate(-0 501.12 132.5448)">Self-hosted only</text>
  </g>
  <g id="text_25">
   <text style="font-size: 8.7048px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="501.12" y="148.3848" transform="rotate(-0 501.12 148.3848)">Google only</text>
  </g>
  <g id="text_26">
   <text style="font-weight: 700; font-size: 70.56px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="486.72" y="239.04" transform="rotate(-0 486.72 239.04)">49.5</text>
  </g>
  <g id="text_27">
   <text style="font-weight: 700; font-size: 28.224px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="625.327875" y="212.832" transform="rotate(-0 625.327875 212.832)">%</text>
  </g>
  <g id="text_28">
   <text style="font-size: 11.0484px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="486.72" y="271.71198" transform="rotate(-0 486.72 271.71198)">of desktop pages use Google</text>
  </g>
  <g id="text_29">
   <text style="font-size: 11.0484px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #181a23" x="486.72" y="286.0749" transform="rotate(-0 486.72 286.0749)">Fonts, alone or with self-hosting.</text>
  </g>
  <g id="text_30">
   <text style="font-style: italic; font-size: 8.498769px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #5b5d66" x="486.72" y="308.188396" transform="rotate(-0 486.72 308.188396)">Adding pages that mix Google with a</text>
  </g>
  <g id="text_31">
   <text style="font-style: italic; font-size: 8.498769px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #5b5d66" x="486.72" y="319.661734" transform="rotate(-0 486.72 319.661734)">third host, its reach is 53.7%.</text>
  </g>
  <g id="text_32">
   <text style="font-size: 7.8552px; font-family: 'Hanken Grotesk'; text-anchor: start; fill: #5b5d66" x="40.32" y="361.145536" transform="rotate(-0 40.32 361.145536)">Source: HTTP Archive desktop root pages, mid-year crawls (2026 = July 1, 2026 crawl). Other combinations not shown. Percentages are of all desktop root pages.</text>
  </g>
